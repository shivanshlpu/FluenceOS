version: '3.8'

services:
  # React Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_PYTHON_API_URL=http://localhost:8000
      - VITE_JAVA_API_URL=http://localhost:8080
    depends_on:
      - python-backend
      - java-backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Python FastAPI Backend (AI Core)
  python-backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend-python/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend-python:/app

  # Java Spring Boot Backend (Market + Skills)
  java-backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=${MONGODB_URL:-mongodb+srv://factsduniya900_db_user:shivansh2005@shi.b4bpwpe.mongodb.net/aios?appName=SHI}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on: []
